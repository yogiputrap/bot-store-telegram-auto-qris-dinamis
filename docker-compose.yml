version: '3.8'

services:
  jstore-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jstore-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
    volumes:
      # Named volumes — dikelola Docker, tidak bergantung path Dokploy
      # Data TIDAK akan hilang saat redeploy
      - jstore_database:/app/database
      - jstore_backups:/app/backups
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Deklarasi named volumes (Docker simpan di /var/lib/docker/volumes/)
volumes:
  jstore_database:
    driver: local
  jstore_backups:
    driver: local
