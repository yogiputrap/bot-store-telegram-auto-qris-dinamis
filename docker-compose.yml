version: '3.8'

services:
  jstore-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jstore-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
    volumes:
      # Persistent storage for SQLite Database and Backups in Dokploy
      - ./database:/app/database
      - ./backups:/app/backups
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
