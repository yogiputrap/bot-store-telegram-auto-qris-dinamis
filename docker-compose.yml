services:
  moakun-store-bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
    volumes:
      # ../files adalah direktori persistent khusus Dokploy
      # Data TIDAK akan hilang saat redeploy — tidak perlu setup manual
      - ../files/database:/app/database
      - ../files/backups:/app/backups
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
